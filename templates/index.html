<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Triage Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">🏠</div>
            <h1>Real Estate Triage</h1>
            <p class="tagline">Your helpful property assistant</p>
        </header>

        <main class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message agent">
                    <div class="bubble">
                        <p>{{ welcome_message }}</p>
                        <p class="prompt">Are you a <strong>Buyer</strong>, <strong>Seller</strong>, or <strong>Renter</strong>?</p>
                    </div>
                </div>
            </div>

            <div class="chat-input-area" id="chatInputArea">
                <form id="chatForm" class="chat-form">
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Type your answer..." 
                        autocomplete="off"
                        autofocus
                    >
                    <button type="submit" id="sendBtn" aria-label="Send">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                        </svg>
                    </button>
                </form>
                <p class="hint">Press Enter to send</p>
            </div>

            <div class="done-message" id="doneMessage" style="display: none;">
                <p>Thank you for using the Real Estate Triage Agent. Goodbye!</p>
                <button id="restartBtn" class="restart-btn">Start New Conversation</button>
            </div>
        </main>
    </div>

    <script>
        const WELCOME_MESSAGE = {{ welcome_message | tojson }};
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const chatInputArea = document.getElementById('chatInputArea');
        const doneMessage = document.getElementById('doneMessage');
        const restartBtn = document.getElementById('restartBtn');

        let state = {};

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = 'message ' + (isUser ? 'user' : 'agent');
            div.innerHTML = '<div class="bubble"><p>' + escapeHtml(text) + '</p></div>';
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = messageInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            messageInput.value = '';
            messageInput.disabled = true;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, state })
                });
                const data = await res.json();

                if (data.reply) {
                    addMessage(data.reply, false);
                }
                state = data.state || {};

                if (data.done) {
                    chatInputArea.style.display = 'none';
                    doneMessage.style.display = 'block';
                }
            } catch (err) {
                addMessage('Sorry, something went wrong. Please try again.', false);
            }
            messageInput.disabled = false;
            messageInput.focus();
        });

        restartBtn.addEventListener('click', () => {
            state = {};
            chatInputArea.style.display = 'block';
            doneMessage.style.display = 'none';
            chatMessages.innerHTML = `
                <div class="message agent">
                    <div class="bubble">
                        <p>${WELCOME_MESSAGE}</p>
                        <p class="prompt">Are you a <strong>Buyer</strong>, <strong>Seller</strong>, or <strong>Renter</strong>?</p>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
